# gitleaks configuration: the pre-push hook, check.sh and the CI jobs all use it.

[extend]
useDefault = true

[allowlist]
description = "What the default rules flag here and is not a secret"
# Matched against the rule's MATCH, never against the whole line: a line-wide
# allowlist hid a real token that sat on the same line as a translation key.
regexTarget = "match"
regexes = [
    # The generic-api-key rule reads `translation_key="..."` in the register
    # table as a credential. Only that spelling is exempt: a bare `key="..."`
    # is not a translation key, and describing one by its SHAPE exempted any
    # value with an underscore in it - the check.sh floor and the workflow's
    # GITLEAKS_VERSION keep the match format that this anchoring needs.
    '''^translation_key="[a-z0-9_]+"$''',
]
# No path allowlist: it would also hide a NEW leak under that path.
