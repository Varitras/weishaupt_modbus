# gitleaks configuration for the pre-push secret scan (.githooks/pre-push).

[extend]
useDefault = true

[allowlist]
description = "What the default rules flag here and is not a secret"
# Match the regexes against the whole line, not the captured "secret": the
# captured part of `translation_key="hp_konf"` is just `hp_konf`, which no
# pattern could tell from a real token.
regexTarget = "line"
regexes = [
    # ModbusItem(..., translation_key="...") - the generic-api-key rule reads
    # `key="..."` as a credential; these are entity translation keys.
    '''translation_key="[a-z0-9_]+"''',
]
paths = [
    # A Home Assistant .storage directory committed upstream in 2024
    # (auth tokens and a password hash of a developer's test instance), deleted
    # again in a later commit. It is in the shared history, not in the tree,
    # and not ours to rewrite - see the decisions ledger.
    '''^\.storage/''',
]
