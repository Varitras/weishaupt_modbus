name: Validate with hassfest

on:
  # The pull request is the CI trigger for a branch; main is checked on
  # the merge commit and the release SHA. An unfiltered push ran every
  # job twice per branch and once more per tag on a commit already green.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hassfest has no releases; the pin names the master commit it was
      # reviewed at. Dependabot moves it.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-09-27
